[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arise-pipeline"
version = "0.1.0"
description = "ARISE - Automated Reduction & Intelligent Source Extraction pipeline for astronomical imaging"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayush" }]
keywords = ["astronomy", "photometry", "image-reduction", "source-extraction", "transient-detection", "ARIES"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "astropy>=6.0",
  "photutils>=1.12",
  "ccdproc>=2.4",
  "astroscrappy>=1.1",
  "astroquery>=0.4.7",
  "reproject>=0.13",
  "scikit-image>=0.22",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "rich>=13.0",
]

[project.optional-dependencies]
accel = ["sep-pjw"]
ml = ["deepCR", "torch"]

[project.scripts]
arise = "arise.cli:main"

[tool.setuptools.packages.find]
include = ["arise*"]

[tool.setuptools.package-data]
arise = ["assets/*"]
